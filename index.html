<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ef7d19"><title>にわとり軍団 おみくじ</title>
<style>:root{--orange:#ef7d19;--dark:#bd5707;--soft:#fff5e9;--ink:#292929;--muted:#777;--line:#f0e4d8}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:650px;margin:auto;padding:35px 16px 50px}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--orange);text-align:center}h1{text-align:center;font-size:clamp(26px,6vw,36px);margin:10px 0}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:0 0 26px}.panel{border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 28px #00000009}.fortune{background:var(--soft);border:1px solid #f7d5b4;border-radius:14px;text-align:center;padding:25px 12px;margin-bottom:17px}.small{font-size:12px;color:var(--muted);font-weight:650}.fortune-name{font-size:38px;font-weight:900;color:var(--dark);margin-top:8px}.placeholder{color:#b6b6b6}.details{display:grid;gap:10px}.detail{border:1px solid var(--line);border-radius:12px;padding:13px 15px}.detail-label{color:var(--dark);font-size:12px;font-weight:800;margin-bottom:7px}.detail-value{font-size:15px;line-height:1.6;font-weight:600}.quote{text-align:center;background:#fffaf4;padding:17px;border-radius:12px;margin-top:12px;border:1px solid var(--line)}.actions{display:grid;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:15px 20px;font-size:15px;font-weight:800;cursor:pointer}#draw{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--dark)}#copy{background:#fff;color:var(--dark);border:1px solid #f0c59c}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:20px;margin-top:13px;color:var(--dark);text-align:center;font-size:13px;font-weight:650}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin-top:16px}footer{text-align:center;color:#aaa;font-size:10px;letter-spacing:.09em;margin-top:26px}@media(min-width:560px){.details{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head>
<body><main><div class="eyebrow">NIWATORI ARMY · FORTUNE</div><h1>にわとり軍団 おみくじ</h1><p class="subtitle">今日の運勢を占ってみよう</p><section class="panel" aria-live="polite"><div class="fortune"><div class="small">本日の運勢</div><div id="fortune" class="fortune-name placeholder">？</div></div><div class="details"><div class="detail"><div class="detail-label">対人運</div><div class="detail-value" id="people">—</div></div><div class="detail"><div class="detail-label">勝負運</div><div class="detail-value" id="game">—</div></div><div class="detail"><div class="detail-label">勉強・仕事運</div><div class="detail-value" id="study">—</div></div><div class="detail"><div class="detail-label">ラッキーカラー</div><div class="detail-value" id="color">—</div></div></div><div class="quote"><div class="detail-label">今日の一言</div><div class="detail-value" id="quote">おみくじを引いてみよう！</div></div><div class="actions"><button id="draw">おみくじを引く</button><button id="copy" disabled>結果をコピー</button></div><div class="status" id="status" role="status"></div><div class="note">結果はランダムに決まります。<br>コピーした結果はDiscordのチャットに貼り付けられます。</div></section><footer>NIWATORI ARMY · OMIKUJI</footer></main>
<script>"use strict";const fortunes=[["大大吉",2],["大吉",13],["中吉",20],["小吉",20],["吉",20],["半吉",10],["末吉",10],["凶",4],["大凶",1]];const candidates={"people":["新しい出会いに恵まれる","何気ない会話が良いきっかけになる","久しぶりの交流に幸運あり","相手の話に耳を傾けると吉","言葉選びに気をつけると良い","無理せず自分のペースで過ごそう","気軽な挨拶から会話が広がりそう","友人の意外な一面を知るかも","感謝の言葉が良い関係を育てる","誰かの相談に乗ると信頼が深まる","共通の趣味が交流のきっかけに","小さな気配りが喜ばれる日","いつもと違う相手と話すと吉","誤解は早めの確認で解消できそう","自分から声をかけると良い流れに","さりげない励ましが相手の力になる","共通の話題が見つかりそう","久しぶりの連絡が嬉しい展開に","思いやりのある返事が好印象","新しいコミュニティに縁がある日","相手の長所に気づけるかも","気負わない会話が心地よさを生む","意見の違いを尊重すると吉","誰かの親切に助けられそう","約束を守ることで信頼が高まる"],"game":["思い切った挑戦が成功につながる","仲間との協力が勝利の鍵","冷静な判断が良い結果を生む","予想外の展開が待っているかも","油断せず慎重に進めよう","勝敗よりも楽しむことを大切に","練習の成果を発揮できるかも","新しい戦略が思わぬ効果を生む","最後まで諦めない姿勢が吉","今日は守りを意識すると良さそう","好機を見極めることが大切","苦手な場面も落ち着いて対応","チームの声かけが力になる","いつもと違う遊び方に発見あり","一度休憩すると調子が戻りそう","序盤は様子を見て進めると吉","ひらめきが勝負を左右するかも","地道な準備が結果につながる","得意な役割で活躍できそう","慌てず次の一手を考えよう","仲間の提案にヒントが隠れている","小さな成功を積み重ねよう","予想外の相手から学びがありそう","今日は集中力が味方するかも","失敗しても切り替えが大切"],"study":["集中力が高まり、作業がはかどる","新しい知識を得るチャンス","コツコツ続けた努力が実を結ぶ","苦手なことに挑戦すると吉","計画を立てて行動すると良い","適度な休憩が効率アップの鍵","復習すると理解が深まりそう","難しい課題は小分けにすると吉","早めの準備が安心につながる","身の回りを整えると集中しやすい","質問することで疑問が晴れる","短い目標を立てると進みやすい","新しい方法を試す価値あり","丁寧な確認がミスを防ぐ","今日覚えたことが後で役立ちそう","朝のうちに重要なことを進めると吉","メモを見直すと思わぬ発見がある","少しずつ進めることが近道に","人に説明すると理解が深まる","苦手分野の基礎を確認してみよう","優先順位を決めるとはかどりそう","新しいアイデアが浮かぶ予感","慣れた作業こそ丁寧に確認","気分転換で視点が変わるかも","昨日の続きに取り組むと良い日"],"color":["赤","青","緑","黄色","白","黒","紫","オレンジ","水色","金色"],"quote":["小さな一歩が、大きな成果につながる。","焦らず、自分のペースを大切に。","思いがけない幸運は、日常の中にある。","挑戦する気持ちを忘れずに。","何気ない出会いを大切にしよう。","今日という一日を楽しもう。","昨日より少し進めば、それで十分。","人とのつながりを大切に。","一つずつ、できることから始めよう。","休むことも前進のひとつ。","いつもの景色に新しい発見がある。","自分らしい選択を大切に。","良い流れは小さな行動から。","うまくいかない日にも学びはある。","笑顔が次の幸運を呼ぶかもしれない。","今日の努力は、未来の自分への贈り物。","遠回りに見える道にも意味がある。","新しい発見は好奇心から生まれる。","大切なのは、昨日の自分より前へ進むこと。","小さな親切が大きな笑顔につながる。","迷ったときは、できることを一つ。","変化を楽しむ気持ちを持とう。","結果だけでなく過程も大切に。","穏やかな時間にも価値がある。","今日の出会いが明日の力になる。"]};const ids=["fortune","people","game","study","color","quote"],els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));const draw=document.getElementById("draw"),copy=document.getElementById("copy"),status=document.getElementById("status");const pick=a=>a[Math.floor(Math.random()*a.length)];let current=null;function fortunePick(){let n=Math.random()*100;for(const [name,weight] of fortunes){if(n<weight)return name;n-=weight}return "吉"}draw.addEventListener("click",()=>{draw.disabled=true;copy.disabled=true;status.textContent="おみくじを抽選中…";for(const id of ids)els[id].textContent="—";els.fortune.classList.add("placeholder");setTimeout(()=>{current={fortune:fortunePick(),...Object.fromEntries(Object.entries(candidates).map(([k,v])=>[k,pick(v)]))};for(const id of ids)els[id].textContent=current[id];els.fortune.classList.remove("placeholder");copy.disabled=false;draw.disabled=false;draw.textContent="もう一度引く";status.textContent="抽選完了。今日もよい一日を！"},3000)});copy.addEventListener("click",async()=>{if(!current)return;const s=`【にわとり軍団 おみくじ】\n本日の運勢：${current.fortune}\n対人運：${current.people}\n勝負運：${current.game}\n勉強・仕事運：${current.study}\nラッキーカラー：${current.color}\n今日の一言：${current.quote}`;try{await navigator.clipboard.writeText(s);status.textContent="結果をコピーしました！Discordに貼り付けられます。"}catch(e){const t=document.createElement("textarea");t.value=s;t.style.position="fixed";t.style.opacity="0";document.body.append(t);t.select();const ok=document.execCommand("copy");t.remove();status.textContent=ok?"結果をコピーしました！":"コピーできませんでした。HTTPSで開いてお試しください。"}});</script></body></html>
